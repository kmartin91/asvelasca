name: CI

# Checks only: nothing is deployed from here. The site is built locally and
# uploaded over FTP by hand (see README, "Deploy").
on:
  push:
    branches:
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # Build check with the public CMS address and no API key: the bundle is
      # thrown away, so no secret is needed.
      - name: Build
        run: yarn build
        env:
          SERVER_URL: https://cms.asvelasca.it/
          API_URL: api
