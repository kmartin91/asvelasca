<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

      name="description"
      content="A.S. Velasca, la terza squadra di Milano: a football club founded in 2015, where every season an artist designs the kit. We are all but a football team."
    />

      name="keywords"
      content="a.s. velasca, marco de girolamo, karim khideur, loris mandelli, wolfgang natlacen, clément tournus, milano, terza squadra di milano"
    />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- CMS: one connection for the API (CORS), one for images. -->
    <link rel="preconnect" href="%SERVER_URL%" crossorigin />
    <link rel="preconnect" href="%SERVER_URL%" />

    <!-- Link previews (LinkedIn, Facebook, X, WhatsApp) read this static head, without running the app. -->

    <meta property="og:site_name" content="A.S. Velasca" />
    <meta property="og:url" content="https://asvelasca.it/" />
    <meta property="og:title" content="A.S. Velasca · La terza squadra di Milano" />

      property="og:description"
      content="We are all but a football team. Founded in Milan in 2015, every season an artist designs the kit."

    <meta property="og:image:type" content="image/jpeg" />

    <meta property="og:image:height" content="630" />

    <meta name="twitter:site" content="@asvelasca" />

      name="twitter:description"
      content="We are all but a football team. Founded in Milan in 2015, every season an artist designs the kit."
    />
    <meta name="twitter:image" content="https://asvelasca.it/og-image.jpg" />

    <!-- Search engines: the club as a sports team (data block, not a script: the CSP allows it). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsTeam",
        "name": "A.S. Velasca",
        "alternateName": "La terza squadra di Milano",
        "sport": "Football",
        "url": "https://asvelasca.it/",
        "logo": "https://asvelasca.it/apple-touch-icon.png",
        "image": "https://asvelasca.it/og-image.jpg",
        "foundingDate": "2015",
        "slogan": "We are all but a football team.",
        "email": "info@asvelasca.it",
        "location": { "@type": "Place", "name": "Milano, Italia" },
        "sameAs": [
          "https://instagram.com/asvelasca/",
          "https://www.facebook.com/ASVelasca",
          "https://x.com/asvelasca"
        ]
      }
    </script>

    <style>
      /* Before the app boots: club colours, no white flash. */
      html { background: #0b0b0c; }
    </style>
